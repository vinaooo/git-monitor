name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-secret-1 gir1.2-glib-2.0
      - run: /usr/bin/python3 -m unittest discover -s tests -t .  # system python: tokens test needs PyGObject

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream libglib2.0-dev-bin
      - run: desktop-file-validate data/*.desktop
      - run: appstreamcli validate --no-net data/*.metainfo.xml
      - run: glib-compile-schemas --strict --dry-run data/
      - run: python3 -m compileall -q painel

  meson-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update && sudo apt-get install -y meson ninja-build libglib2.0-dev libglib2.0-dev-bin desktop-file-utils libgtk-4-bin
          gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-secret-1 python3-gi
      - run: meson setup build --prefix=$PWD/_prefix && meson install -C build
      - name: Every module imports
        run: |
          export GSETTINGS_SCHEMA_DIR=$PWD/_prefix/share/glib-2.0/schemas
          cd _prefix/share/painel
          for f in painel/*.py; do
            m=$(basename "$f" .py); [ "$m" = __init__ ] && continue
            /usr/bin/python3 -c "import gi; gi.require_version('Gtk', '4.0'); gi.require_version('Adw', '1'); import painel.$m" || exit 1
          done
